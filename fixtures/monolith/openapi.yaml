openapi: 3.0.3
info:
  title: Clinic Booking API
  version: 1.0.0
  description: Book, view and cancel doctor appointments.
servers:
  - url: https://api.clinic-booking.example.com/v1
tags:
  - name: patients
  - name: doctors
  - name: appointments
paths:
  /patients:
    post:
      tags: [patients]
      operationId: createPatient
      summary: Register a patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Patient'
      responses:
        '201':
          description: Patient created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/BadRequest'
  /patients/{patientId}:
    get:
      tags: [patients]
      operationId: getPatient
      summary: Get a patient
      parameters:
        - $ref: '#/components/parameters/PatientId'
      responses:
        '200':
          description: The patient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '404':
          $ref: '#/components/responses/NotFound'
  /doctors:
    get:
      tags: [doctors]
      operationId: listDoctors
      summary: List doctors
      parameters:
        - name: specialty
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Doctors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Doctor'
  /doctors/{doctorId}:
    get:
      tags: [doctors]
      operationId: getDoctor
      summary: Get a doctor
      parameters:
        - $ref: '#/components/parameters/DoctorId'
      responses:
        '200':
          description: The doctor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doctor'
        '404':
          $ref: '#/components/responses/NotFound'
  /doctors/{doctorId}/slots:
    get:
      tags: [doctors]
      operationId: listDoctorSlots
      summary: List open time slots for a doctor
      parameters:
        - $ref: '#/components/parameters/DoctorId'
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Open slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeSlot'
  /appointments:
    post:
      tags: [appointments]
      operationId: createAppointment
      summary: Book an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentRequest'
      responses:
        '201':
          description: Appointment booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Slot already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [appointments]
      operationId: listAppointments
      summary: List appointments for a patient
      parameters:
        - name: patientId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'
  /appointments/{appointmentId}:
    get:
      tags: [appointments]
      operationId: getAppointment
      summary: Get an appointment
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: The appointment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '404':
          $ref: '#/components/responses/NotFound'
  /appointments/{appointmentId}/cancel:
    post:
      tags: [appointments]
      operationId: cancelAppointment
      summary: Cancel an appointment
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 500
                notifyDoctor:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Appointment cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    PatientId:
      name: patientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DoctorId:
      name: doctorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Address:
      type: object
      required: [line1, city, postalCode, country]
      properties:
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        province:
          type: string
        postalCode:
          type: string
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2 country code
    Insurance:
      type: object
      required: [provider, policyNumber]
      properties:
        provider:
          type: string
        policyNumber:
          type: string
        groupNumber:
          type: string
    Patient:
      type: object
      required: [firstName, lastName, dateOfBirth, email, phone]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        dateOfBirth:
          type: string
          format: date
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          pattern: '^\+[1-9]\d{1,14}$'
          description: Phone number in E.164 format
        address:
          $ref: '#/components/schemas/Address'
        insurance:
          $ref: '#/components/schemas/Insurance'
    Doctor:
      type: object
      required: [id, firstName, lastName, specialty]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        specialty:
          type: string
        yearsOfExperience:
          type: integer
          format: int32
          minimum: 0
        acceptingNewPatients:
          type: boolean
          default: true
        clinicAddress:
          $ref: '#/components/schemas/Address'
    TimeSlot:
      type: object
      required: [doctorId, start, end]
      properties:
        doctorId:
          type: string
          format: uuid
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    AppointmentStatus:
      type: string
      enum: [SCHEDULED, CONFIRMED, COMPLETED, CANCELLED, NO_SHOW]
    AppointmentType:
      type: string
      enum: [IN_PERSON, VIDEO, PHONE]
    Appointment:
      type: object
      required: [id, patientId, doctorId, startTime, durationMinutes, status, type]
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        doctorId:
          type: string
          format: uuid
        startTime:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          format: int32
          minimum: 5
          maximum: 240
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        type:
          $ref: '#/components/schemas/AppointmentType'
        reason:
          type: string
          description: Reason for the visit, as given by the patient
        notes:
          type: string
          nullable: true
    CreateAppointmentRequest:
      type: object
      required: [patientId, doctorId, startTime, type]
      properties:
        patientId:
          type: string
          format: uuid
        doctorId:
          type: string
          format: uuid
        startTime:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          format: int32
          default: 30
        type:
          $ref: '#/components/schemas/AppointmentType'
        reason:
          type: string
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
